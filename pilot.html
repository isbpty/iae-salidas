<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IAE Salidas · Piloto conectado</title><link rel="stylesheet" href="styles.css"><style>
.pilot-shell{max-width:1180px;margin:0 auto;padding:20px}.pilot-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.status{display:flex;gap:8px;flex-wrap:wrap}.dot-ok,.dot-off{padding:6px 10px;border-radius:999px;font-size:12px}.dot-ok{background:#dcfce7;color:#166534}.dot-off{background:#fee2e2;color:#991b1b}.pilot-grid{display:grid;grid-template-columns:340px 1fr;gap:16px}.panel{background:#fff;border:1px solid #dbe2ea;border-radius:14px;padding:16px}.panel h2{margin-top:0}.msg-list{max-height:420px;overflow:auto}.request{border:1px solid #dbe2ea;border-radius:12px;padding:12px;margin:10px 0}.request.pending{border-left:4px solid #d97706}.request.approved{border-left:4px solid #16a34a}.request.picked_up{border-left:4px solid #2563eb}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pilot-shell select,.pilot-shell input,.pilot-shell textarea{width:100%;padding:9px;border:1px solid #ccd5df;border-radius:8px}.pilot-shell button{border:0;border-radius:8px;padding:9px 12px;cursor:pointer}.primary{background:#1f5eff;color:#fff}.danger{background:#fee2e2;color:#991b1b}.muted{color:#657184}.small{font-size:12px}.audit{font-family:ui-monospace,monospace;font-size:12px;border-bottom:1px solid #eef1f4;padding:8px 0}@media(max-width:800px){.pilot-grid{grid-template-columns:1fr}.pilot-head{align-items:flex-start;flex-direction:column}}
.login{max-width:420px;margin:10vh auto}.login label{display:block;margin:14px 0}.login button{width:100%}</style></head><body><div class="pilot-shell"><header class="pilot-head"><div><h1>🏫 IAE Salidas</h1><div class="muted">Piloto conectado · estado compartido</div></div><div id="transport" class="status"></div></header><div class="panel row" style="justify-content:space-between"><div id="identity"></div><a href="demo.html">Abrir prototipo visual original</a></div><div class="pilot-grid" style="margin-top:16px"><section class="panel"><h2>💬 Simulador</h2><p class="small muted">Demuestra el flujo sin emparejar WhatsApp.</p><textarea id="message" rows="4">Necesito retirar a Joseph hoy a las 16:45, lo retira la abuela</textarea><button class="primary" id="send" style="margin-top:8px">Enviar mensaje simulado</button><div id="reply" class="request" hidden></div><h3>Avisos de esta sesión</h3><div id="notifications" class="msg-list"></div></section><main><section class="panel"><div class="row" style="justify-content:space-between"><h2>Solicitudes compartidas</h2><span class="small muted">Actualización en vivo</span></div><div id="requests"></div></section><section class="panel" style="margin-top:16px"><h2>Bitácora</h2><div id="audit"></div></section><section class="panel" style="margin-top:16px"><h2>Entregas</h2><div id="deliveries"></div><div id="qrPayload" class="small muted"></div></section></main></div></div><script type="module" src="pilot.js"></script></body></html>
